<!DOCTYPE html>
<html>
<head>
  <title>SafeTube</title>
  <style>
    body {
      font-family: sans-serif;
      width: 280px;
      padding: 8px;
    }

    .hidden {
      display: none;
    }

    input {
      width: 100%;
      margin-bottom: 8px;
      padding: 4px;
    }

    button {
      width: 100%;
      margin-bottom: 6px;
      padding: 6px;
      cursor: pointer;
    }

    h3 {
      margin-top: 0;
    }

    #childLabel {
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <!-- ================= PAIRING SCREEN ================= -->
  <div id="pairScreen">
    <h3>Connect Child Device</h3>

    <input
      id="pairCodeInput"
      type="text"
      placeholder="Enter pairing code"
    />

    <button id="pairBtn">Connect</button>

    <p id="pairStatus"></p>
  </div>

  <!-- ================= MAIN SCREEN ================= -->
  <div id="mainScreen" class="hidden">
    <div id="childLabel">Connected</div>

    <input
      id="videoIdInput"
      type="text"
      placeholder="YouTube Video ID"
    />

    <button id="addButton">Allow This Video</button>

    <!-- IMPORTANT: this ID must match popup.js -->
    <button id="rmChannelButton">Block This Channel</button>

    <ul id="allowlist"></ul>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
