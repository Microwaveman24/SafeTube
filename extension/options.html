<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SafeTube Settings</title>
  <style>
    body { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 20px; color: #1f1f1f; }
    h1 { font-size: 22px; }
    p.hint { color: #5f6368; font-size: 14px; }
    label { display: block; font-weight: 600; font-size: 14px; margin: 18px 0 6px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 14px; border: 1px solid #dadce0; border-radius: 8px; }
    .row { margin-top: 24px; display: flex; gap: 12px; }
    button { font-size: 14px; font-weight: 600; padding: 10px 20px; border-radius: 999px; border: none; cursor: pointer; }
    #saveBtn { background: #1a73e8; color: #fff; }
    #testBtn { background: #f1f3f4; color: #1f1f1f; }
    #status { margin-top: 18px; font-size: 14px; min-height: 20px; }
    #status.ok { color: #137333; }
    #status.err { color: #b3261e; }
  </style>
</head>
<body>
  <h1>🛡️ SafeTube Settings</h1>
  <p class="hint">Connect this browser to your family's SafeTube parent server. A parent should fill this in.</p>

  <label for="baseUrl">Parent server base URL</label>
  <input id="baseUrl" type="text" placeholder="http://localhost:3000" spellcheck="false">

  <label for="familyKey">Family key (shared secret)</label>
  <input id="familyKey" type="password" placeholder="Enter the family key" spellcheck="false">

  <label for="childName">Child name</label>
  <input id="childName" type="text" placeholder="e.g. Alex" spellcheck="false">

  <div class="row">
    <button id="saveBtn" type="button">Save</button>
    <button id="testBtn" type="button">Test connection</button>
  </div>

  <div id="status"></div>

  <h2 style="font-size:16px;margin-top:28px;">This device</h2>
  <p class="hint">The parent dashboard identifies this browser by its device ID. If the extension is
     disabled or removed, the parent gets an email when this device stops checking in.</p>
  <p class="hint" style="font-family:ui-monospace,monospace;word-break:break-all;" id="deviceId">…</p>

  <script src="options.js"></script>
</body>
</html>
