<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Parent Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        li:last-child {
            border-bottom: none;
        }

        input {
            padding: 8px;
            width: 200px;
            margin-right: 8px;
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
        }

        .status {
            margin-top: 10px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <h1>Parent Dashboard</h1>

    <div class="card">
        <h3>Account</h3>
        <p>Email: <strong id="parentEmail">Loading...</strong></p>
    </div>

    <div class="card">
    <h3>Children</h3>

    <div>
        <input type="text" id="childNameInput" placeholder="Child name">
        <button id="addChildBtn">Add Child</button>
    </div>

    <ul id="childrenList"></ul>
</div>

    <script src="/static/dashboard.js"></script>
</body>
</html>
